name: Daily AI Running Coach

on:
  schedule:
    # 每天 UTC 22:30 运行 = 北京时间 (UTC+8) 每天早上 06:30
    - cron: '30 22 * * *'
  push:
    branches:
      - main
    paths:
      - 'config/**'
      - 'src/**'
      - '.github/workflows/daily-coach.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  run_coach:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run AI Running Coach pipeline
        env:
          GARMIN_AUTH_MODE: ${{ secrets.GARMIN_AUTH_MODE || 'auto' }}
          GARMIN_REGION: ${{ secrets.GARMIN_REGION || 'cn' }}
          GARMIN_PERSONAL_API_KEY: ${{ secrets.GARMIN_PERSONAL_API_KEY }}
          GARMIN_BASE_URL: ${{ secrets.GARMIN_BASE_URL }}
          GARMIN_EMAIL: ${{ secrets.GARMIN_EMAIL }}
          GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD }}
          GARMIN_SESSION_JSON: ${{ secrets.GARMIN_SESSION_JSON }}
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          WECOM_WEBHOOK: ${{ secrets.WECOM_WEBHOOK }}
          DINGTALK_WEBHOOK: ${{ secrets.DINGTALK_WEBHOOK }}
          SERVERCHAN_KEY: ${{ secrets.SERVERCHAN_KEY }}
          BARK_URL: ${{ secrets.BARK_URL }}
          DASHBOARD_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: node src/index.js

      - name: Upload private dashboard artifact
        uses: actions/upload-artifact@v4
        with:
          name: running-coach-dashboard
          path: ./dist
          retention-days: 14

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  deploy_pages:
    needs: run_coach
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
